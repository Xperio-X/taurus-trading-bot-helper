<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 340px;
      background: #0f1117;
      color: #e2e8f0;
      padding: 16px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      margin-top: 10px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 12px;
      font-family: monospace;
    }

    input:focus { outline: none; border-color: #38bdf8; }

    .toggle-secret {
      font-size: 10px;
      color: #64748b;
      cursor: pointer;
      float: right;
      margin-top: -4px;
    }
    .toggle-secret:hover { color: #94a3b8; }

    button {
      width: 100%;
      padding: 9px;
      margin-top: 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-authorize {
      background: #38bdf8;
      color: #0f1117;
    }

    #status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    #status.info  { background: #1e3a5f; color: #7dd3fc; }
    #status.success { background: #14532d; color: #86efac; }
    #status.error { background: #4c1d1d; color: #fca5a5; }

    #token-section { display: none; margin-top: 12px; }

    #token-section label {
      margin-top: 0;
      margin-bottom: 6px;
      color: #86efac;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 8px 10px;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #86efac;
      font-size: 11px;
      font-family: monospace;
      resize: vertical;
    }

    #btn-copy {
      background: #166534;
      color: #86efac;
      margin-top: 8px;
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #475569;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Taurus — Schwab Token Renewal</h1>

  <label for="client-id">Client ID</label>
  <input type="text" id="client-id" placeholder="Your Schwab app client ID" autocomplete="off" spellcheck="false">

  <label for="client-secret">
    Client Secret
    <span class="toggle-secret" id="toggle-secret">show</span>
  </label>
  <input type="password" id="client-secret" placeholder="Your Schwab app client secret" autocomplete="off" spellcheck="false">

  <button id="btn-authorize">Authorize with Schwab</button>

  <div id="status"></div>

  <div id="token-section">
    <label>Token JSON — copy into SCHWAB_TOKEN_JSON in all 6 cloud routines</label>
    <textarea id="token-output" readonly></textarea>
    <button id="btn-copy">Copy to Clipboard</button>
    <p class="hint">Paste this value into SCHWAB_TOKEN_JSON in all 6 cloud routines. Valid until next Sunday — renew weekly.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
